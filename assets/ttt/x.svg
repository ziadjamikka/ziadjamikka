<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="X — a human move">
<defs>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
    <stop offset="0" stop-color="#0c1622"/>
    <stop offset="1" stop-color="#000000"/>
  </radialGradient>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
    <circle cx="1.5" cy="1.5" r="1.2" fill="#23444b" opacity="0.45"/>
  </pattern>
  
</defs>
<rect x="3" y="3" width="94" height="94" rx="16" fill="#1f2b29" stroke="#23444b" stroke-width="2"/>
<g stroke="#628d7c" stroke-width="9" stroke-linecap="round" fill="none" filter="url(#glow)">
  <line x1="28" y1="28" x2="72" y2="72" stroke-dasharray="63" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" values="63;0" dur="0.35s" fill="freeze"/>
  </line>
  <line x1="72" y1="28" x2="28" y2="72" stroke-dasharray="63" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" values="63;63;0" keyTimes="0;0.45;1" dur="0.65s" fill="freeze"/>
  </line>
</g>
</svg>