<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Empty cell — click to play here">
<defs>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
    <stop offset="0" stop-color="#0c1622"/>
    <stop offset="1" stop-color="#000000"/>
  </radialGradient>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
    <circle cx="1.5" cy="1.5" r="1.2" fill="#23444b" opacity="0.45"/>
  </pattern>
  
</defs>
<rect x="3" y="3" width="94" height="94" rx="16" fill="#1f2b29" stroke="#23444b" stroke-width="2"/>
<rect x="3" y="3" width="94" height="94" rx="16" fill="none" stroke="#628d7c" stroke-width="2" stroke-dasharray="7 7" opacity="0.5">
  <animate attributeName="stroke-dashoffset" values="0;28" dur="1.8s" repeatCount="indefinite"/>
</rect>
<g stroke="#628d7c" stroke-width="3" stroke-linecap="round">
  <line x1="50" y1="37" x2="50" y2="63"/><line x1="37" y1="50" x2="63" y2="50"/>
  <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2s" repeatCount="indefinite"/>
</g>
</svg>