<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="O — the AI's move">
<defs>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
    <stop offset="0" stop-color="#0c1622"/>
    <stop offset="1" stop-color="#000000"/>
  </radialGradient>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
    <circle cx="1.5" cy="1.5" r="1.2" fill="#23444b" opacity="0.45"/>
  </pattern>
  
</defs>
<rect x="3" y="3" width="94" height="94" rx="16" fill="#1f2b29" stroke="#23444b" stroke-width="2"/>
<circle cx="50" cy="50" r="24" fill="none" stroke="#628d7c" stroke-width="13" opacity="0.35"/>
<circle cx="50" cy="50" r="24" fill="none" stroke="#000000" stroke-width="9" stroke-linecap="round"
        stroke-dasharray="151" stroke-dashoffset="0" transform="rotate(-90 50 50)">
  <animate attributeName="stroke-dashoffset" values="151;0" dur="0.6s" fill="freeze"/>
</circle>
</svg>