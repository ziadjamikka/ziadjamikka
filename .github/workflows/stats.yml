name: 📊 Profile stats

# Renders the stats cards embedded in README.md (stats.svg, langs.svg,
# streak.svg) with tools/generate_stats.py and publishes them to the `stats`
# branch, so the profile never depends on a third-party card service.
# Runs daily, on changes to the generator, and by hand from the Actions tab.

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/generate_stats.py
      - .github/workflows/stats.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the profile repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render the cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: python tools/generate_stats.py dist

      - name: Publish to the stats branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: stats
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
