name: 🎮 Tic-Tac-Toe

# Every empty cell on the profile links to a pre-filled issue titled `ttt|move|<cell>`.
# This workflow plays the AI's turn, rewrites the board in README.md and closes the issue.

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: tictactoe
  cancel-in-progress: false

jobs:
  play:
    if: startsWith(github.event.issue.title, 'ttt|')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the profile repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Play the move
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          REPO: ${{ github.repository }}
        run: python game/tictactoe.py

      - name: Commit the new board
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md game/state.json
          if git diff --cached --quiet; then
            echo "Board unchanged — nothing to commit."
          else
            git commit -m "🎮 @${{ github.event.issue.user.login }} played (#${{ github.event.issue.number }})"
            git pull --rebase origin ${{ github.event.repository.default_branch }}
            git push
          fi

      - name: Reply and close the issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue close "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --comment "$(cat game/comment.md)"
